appId: com.bkhorn.tizo
productName: Video Downloader Tizo
copyright: Copyright © 2026 BKHornYT

directories:
  buildResources: build
  output: dist

files:
  - out/**
  - '!**/*.map'
  - '!**/*.ts'

# Slim installer by design: ffmpeg, yt-dlp and the site profiles are NOT packed
# here. They arrive in the first-run Essentials download. See docs/plan.md.
# The one exception: yt-dlp extractor plugins are a few KB of text, and they are
# what make a site supported at all. Packing them keeps that working offline and
# on first run, before any registry fetch has happened.
extraResources:
  - from: resources/plugins
    to: plugins

win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
    - target: zip
      arch: [x64]
  artifactName: ${name}-${version}-${arch}.${ext}
  # Unsigned for now — users will see a SmartScreen warning. Signing config
  # slots in here later without touching anything else.

nsis:
  artifactName: ${name}-${version}-setup.${ext}
  oneClick: false
  perMachine: false # per-user install needs no admin rights
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Video Downloader Tizo
  deleteAppDataOnUninstall: false # keep history and downloaded components

portable:
  artifactName: ${name}-${version}-portable.${ext}
  requestExecutionLevel: user

# AppImage only, and that is a deliberate narrowing rather than a starting point.
# electron-updater can self-update an AppImage; it cannot update a deb, rpm or
# snap. Self-updating is the whole reason this app exists in its current shape,
# so a Linux target that can never fix itself would be shipping the promise
# without the mechanism. A deb can follow later behind the same "download the
# new one" banner the portable exe already shows.
#
# The icon is the 256px source: electron-builder's 512 minimum applies only to
# macOS .icns, and Linux takes 256 — so no upscaling and no soft icon.
linux:
  icon: build/iconsrc/icon-256.png
  category: AudioVideo
  synopsis: Universal video downloader
  description: >-
    Download video and audio from around 1800 sites. Paste a link, pick a
    format, get a file.
  target:
    - target: AppImage
      arch: [x64]
  artifactName: ${name}-${version}-${arch}.${ext}

publish:
  provider: github
  owner: BKHornYT
  repo: tizo
  # electron-builder defaults to a draft release. Drafts are invisible to
  # electron-updater, so a "successful" release would sit there updating nobody
  # until someone remembered to press Publish.
  releaseType: release
