<!doctype html>
<!--
  Synthetic KVS page. Entirely invented: every host is `.invalid`, which can
  never resolve, and no part of it comes from a real site. It exists to exercise
  one thing -- the config object is declared under a name of its own instead of
  in the assignment yt-dlp looks for, which is exactly the deployment shape that
  made yt-dlp report it could not extract them while every field it needed was
  sitting in the page.

  Nothing here may spell out the assignment yt-dlp searches for, not even in a
  comment: the plugin decides whether to widen by asking whether that assignment
  is present, so writing it out anywhere in the file switches off the very
  behaviour this fixture exists to test.

  `video_url` is deliberately NOT `function/0/...`-obfuscated: yt-dlp returns a
  plain URL unchanged, so the fixture tests our detection without pinning the
  test to yt-dlp's decoder internals.
-->
<html>
<head>
  <title>Synthetic KVS fixture</title>
  <script src="https://cdn.example.invalid/player/kt_player.js?v=6.3.2"></script>
</head>
<body>
  <script>
    var kt_player_config = {
      video_id: '4242',
      license_code: '$1234567890',
      preview_url: 'https://cdn.example.invalid/preview/4242.jpg',
      video_url: 'https://cdn.example.invalid/get_file/1/4242/720p.mp4',
      video_url_text: '720p',
      video_alt_url: 'https://cdn.example.invalid/get_file/1/4242/480p.mp4',
      video_alt_url_text: '480p'
    };
    kt_player('player', 'https://cdn.example.invalid/player/kt_player.swf?v=6.3.2', kt_player_config);
  </script>
</body>
</html>
