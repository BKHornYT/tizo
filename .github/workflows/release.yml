name: Release

# Tag-driven: `git tag v0.1.0 && git push --tags` builds and publishes.
# The tag must match the version in package.json — electron-updater compares
# against the version inside the artifacts, not the tag, so a mismatch produces
# a release that silently never updates anyone.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check the tag matches package.json
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag v$TAG does not match package.json version $PKG"
            exit 1
          fi
          echo "releasing $PKG"

      # `npm test` now includes test:plugins, which runs the real engine against
      # the real plugin files and FAILS rather than skips without a binary. That
      # is deliberate — a silent skip is how the v0.0.11 extractor bug reached
      # two releases — but it means CI has to supply one.
      - name: Fetch yt-dlp for the plugin test
        shell: bash
        run: |
          mkdir -p .tools
          curl -fsSL -o .tools/yt-dlp.exe \
            https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe
          echo "TIZO_YTDLP=$(node -p "require('path').resolve('.tools/yt-dlp.exe')")" >> "$GITHUB_ENV"

      - name: Typecheck and test
        run: npm test

      # electron-builder only packages what is already in out/ — it does not
      # run the bundler. Skipping this produces an app.asar with no entry file
      # and a build that fails at the very last step.
      - name: Bundle main, preload and renderer
        run: npm run build
        env:
          TIZO_STATS_ENDPOINT: ${{ vars.TIZO_STATS_ENDPOINT }}

      - name: Package and publish
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Deliberately `needs: windows` rather than parallel. Both jobs publish into
  # the same GitHub release, and two runners racing to create it is a 422 on
  # whichever loses. Serialising costs a few minutes and removes the race
  # entirely. It also means the tag/version guard above gates both builds.
  linux:
    needs: windows
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # As on Windows — see the note there. `yt-dlp_linux` is the build the
      # registry ships, and a downloaded binary carries no execute bit.
      - name: Fetch yt-dlp for the plugin test
        shell: bash
        run: |
          mkdir -p .tools
          curl -fsSL -o .tools/yt-dlp \
            https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_linux
          chmod +x .tools/yt-dlp
          echo "TIZO_YTDLP=$(node -p "require('path').resolve('.tools/yt-dlp')")" >> "$GITHUB_ENV"

      - name: Typecheck and test
        run: npm test

      - name: Bundle main, preload and renderer
        run: npm run build
        env:
          TIZO_STATS_ENDPOINT: ${{ vars.TIZO_STATS_ENDPOINT }}

      # AppImage only — see the comment in electron-builder.yml. This uploads its
      # own `latest-linux.yml`, a separate feed from the Windows `latest.yml`, so
      # the two update channels never read each other's versions.
      - name: Package and publish
        run: npx electron-builder --linux --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
