name: Release

# Tag-driven: `git tag v0.1.0 && git push --tags` builds and publishes.
# The tag must match the version in package.json — electron-updater compares
# against the version inside the artifacts, not the tag, so a mismatch produces
# a release that silently never updates anyone.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check the tag matches package.json
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag v$TAG does not match package.json version $PKG"
            exit 1
          fi
          echo "releasing $PKG"

      - name: Typecheck and test
        run: npm test

      # electron-builder only packages what is already in out/ — it does not
      # run the bundler. Skipping this produces an app.asar with no entry file
      # and a build that fails at the very last step.
      - name: Bundle main, preload and renderer
        run: npm run build
        env:
          TIZO_STATS_ENDPOINT: ${{ vars.TIZO_STATS_ENDPOINT }}

      - name: Package and publish
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
